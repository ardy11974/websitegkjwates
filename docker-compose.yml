services:
  mysql:
    image: mysql:8
    container_name: webgkjwates-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: gkjwates
      MYSQL_USER: gkjuser
      MYSQL_PASSWORD: gkjpass
    volumes:
      - ./mysql-data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: webgkjwates-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "5010:5000"

  frontend:
    build: ./frontend
    container_name: webgkjwates-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3010:80"
